name: Extract source from zip

on:
  workflow_dispatch:
  push:
    paths:
      - 'src.zip'

permissions:
  contents: write

jobs:
  extract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure zip exists
        run: test -f src.zip

      - name: Clean repo (except zip + workflow)
        run: |
          shopt -s dotglob
          for f in * .*; do
            case "$f" in
              .|..|.git|.github|src.zip) continue;;
            esac
            rm -rf "$f"
          done

      - name: Extract
        run: unzip -oq src.zip

      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m "extract src.zip" || exit 0
          git push
